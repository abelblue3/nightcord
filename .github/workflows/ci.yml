name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Audit dependencies
        # PYSEC-2026-1325 (ecdsa): no fix version exists -- the maintainers
        # have publicly declined to fix pure-Python timing side-channels by
        # design, and recommend the `cryptography` package for anything
        # sensitive. It's a transitive dependency of python-jose, but this
        # app only ever uses HS256 (symmetric HMAC), never the vulnerable
        # ECDSA code path, so it's ignored here rather than left unfixable
        # and permanently blocking CI.
        run: pip-audit -r requirements-dev.txt --ignore-vuln PYSEC-2026-1325

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nightcord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests against real Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nightcord_test
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build the production image
        working-directory: .
        run: docker build -f web/Dockerfile -t nightcord-web .

  e2e:
    # The whole chain as deployed: built pages and API calls through the Ruby
    # web layer to FastAPI, exercised by the same script as the prod canary.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/e2e.db
      SECRET_KEY: e2e-secret
      ENVIRONMENT: development
      CANARY_EMAIL: canary@nightcord.internal
      CANARY_PASSWORD: e2e-canary-password
      CANARY_BYPASS_TOKEN: e2e-canary-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install canary dependencies
        working-directory: scripts
        run: npm install

      - name: Create the database and seed the canary account
        working-directory: backend
        run: |
          python -c "from app.database import Base, engine; from app import models; Base.metadata.create_all(engine)"
          python scripts/seed_canary.py

      - name: Start FastAPI
        working-directory: backend
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Start the web layer
        working-directory: web
        env:
          PORT: "4567"
          BACKEND_URL: http://127.0.0.1:8000
        run: bundle exec ruby bin/server.rb > "$RUNNER_TEMP/web.log" 2>&1 &

      - name: Wait for both
        run: |
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4567/healthz

      - name: Run the canary through the web layer
        working-directory: scripts
        env:
          CANARY_FRONTEND_URL: http://127.0.0.1:4567
          CANARY_API_URL: http://127.0.0.1:4567/api
        run: node canary.mjs

      - name: Server logs
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/web.log"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
