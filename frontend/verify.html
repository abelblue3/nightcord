<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nightcord — verify</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div class="screen">
      <div class="stack">
        <h1 class="center-text">NIGHTCORD<span class="blink">_</span></h1>
        <p class="center-text hint" style="margin-top: -8px;">enter the code we sent to your email</p>

        <div class="panel">
          <div class="error-box" id="error-box"></div>

          <form id="verify-form">
            <div class="field">
              <label for="verify-email">Student email</label>
              <input type="email" id="verify-email" required placeholder="you@college.edu" />
            </div>
            <div class="field">
              <label for="verify-code">6-digit code</label>
              <input
                type="text"
                id="verify-code"
                required
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="000000"
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="verify-submit">Verify</button>
          </form>

          <button type="button" class="btn btn-block" id="resend-btn" style="margin-top: 10px;">Resend code</button>
          <a href="/index.html" class="btn btn-block" style="margin-top: 10px; text-decoration: none;">Back to login</a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/verify.js"></script>
  </body>
</html>
