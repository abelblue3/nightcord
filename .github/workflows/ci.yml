name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Audit dependencies
        run: pip-audit -r requirements-dev.txt

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nightcord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The real migration chain, as Railway runs it before each deploy, and a
      # check that the models and migrations describe the same schema.
      - name: Migrations apply cleanly and match the models
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nightcord_migrations
        run: |
          createdb -h localhost -U postgres nightcord_migrations
          alembic upgrade head
          alembic check

      - name: Run tests against real Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nightcord_test
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build the production image
        working-directory: .
        run: docker build -f web/Dockerfile -t nightcord-web .

  e2e:
    # The whole chain, exercised by the same script as the prod canary: once
    # through the Ruby web layer (the local setup) and once against FastAPI
    # directly (how production's pages call it).
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/e2e.db
      ENVIRONMENT: development
      CANARY_CLERK_USER_ID: user_canary_ci
      CANARY_BYPASS_TOKEN: e2e-canary-token
    steps:
      - uses: actions/checkout@v4

      # Stands in for the Clerk instance: FastAPI verifies tokens with the
      # public half (CLERK_JWT_KEY), and the canary signs its own token with
      # the private half. Throwaway, CI-only.
      - name: Generate a test signing key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/clerk-test.pem"
          openssl pkey -in "$RUNNER_TEMP/clerk-test.pem" -pubout -out "$RUNNER_TEMP/clerk-test.pub.pem"
          {
            echo "CLERK_JWT_KEY<<PEM"; cat "$RUNNER_TEMP/clerk-test.pub.pem"; echo "PEM"
            echo "CANARY_TEST_PRIVATE_KEY<<PEM"; cat "$RUNNER_TEMP/clerk-test.pem"; echo "PEM"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install canary dependencies
        working-directory: scripts
        run: npm install

      - name: Create the database and seed the canary account
        working-directory: backend
        run: |
          python -c "from app.database import Base, engine; from app import models; Base.metadata.create_all(engine)"
          python scripts/seed_canary.py

      - name: Start FastAPI
        working-directory: backend
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Start the web layer
        working-directory: web
        env:
          PORT: "4567"
          BACKEND_URL: http://127.0.0.1:8000
        run: bundle exec ruby bin/server.rb > "$RUNNER_TEMP/web.log" 2>&1 &

      - name: Wait for both
        run: |
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4567/healthz

      - name: Run the canary through the web layer
        working-directory: scripts
        env:
          CANARY_FRONTEND_URL: http://127.0.0.1:4567
          CANARY_API_URL: http://127.0.0.1:4567/api
        run: node canary.mjs

      - name: Run the canary against FastAPI directly, as production calls it
        working-directory: scripts
        env:
          CANARY_FRONTEND_URL: http://127.0.0.1:4567
          CANARY_API_URL: http://127.0.0.1:8000
        run: node canary.mjs

      - name: Server logs
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/web.log"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
