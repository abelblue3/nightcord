<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nightcord</title>
    <script src="/theme-init.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="screen">
      <div class="stack">
        <h1 class="center-text">NIGHTCORD<span class="blink">_</span></h1>
        <p class="center-text hint" style="margin-top: -8px;">a quiet room for night owls studying late</p>
        <p class="center-text hint" style="margin-top: -8px; font-size: 0.85rem;">sign up any time — study rooms open 9pm–6am at your school</p>

        <div class="panel">
          <div class="tabs">
            <button class="tab active" id="tab-login" type="button">Login</button>
            <button class="tab" id="tab-signup" type="button">Sign Up</button>
          </div>

          <div class="error-box" id="error-box"></div>

          <div id="google-signin-btn" class="center-text" style="margin-bottom: 16px;"></div>
          <p class="hint center-text" style="margin-top: -8px;">— or —</p>

          <form id="login-form">
            <div class="field">
              <label for="login-email">Student email</label>
              <input type="email" id="login-email" required placeholder="you@college.edu" />
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-submit">Enter</button>
          </form>

          <form id="signup-form" style="display: none;">
            <div class="field">
              <label for="signup-name">Display name</label>
              <input type="text" id="signup-name" required placeholder="what should we call you?" />
            </div>
            <div class="field">
              <label for="signup-email">Student email (.edu)</label>
              <input type="email" id="signup-email" required placeholder="you@college.edu" />
            </div>
            <div class="hint">Only .edu addresses can sign up.</div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input type="password" id="signup-password" required minlength="8" placeholder="8+ characters" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Join</button>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
